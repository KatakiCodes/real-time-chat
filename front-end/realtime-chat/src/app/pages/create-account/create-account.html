<app-introduce-layout [showIlustration]="false">
    <div class="input-section w-full py-8 flex flex-col items-center">
            <h2 class="text-2xl text-center text-blue-500 mb-4">Criar conta</h2>
            <form action="" method="post" class="flex flex-col gap-3 justify-center items-center w-full">
                <div class="form__email w-2/3 text-center">
                    <label for="email" class="block text-sm text-gray-700 mb-1 text-left w-full">E-mail</label>
                    <app-text-input id="email" type="email" placeholder="E-mail" class="mb-3" ></app-text-input>
                </div>
                <div class="form__username w-2/3 text-center">
                    <label for="username" class="block text-sm text-gray-700 mb-1 text-left w-full">Nome de utilizador</label>
                    <app-text-input id="username" type="text" placeholder="Nome de utilizador" class="mb-3"></app-text-input>
                </div>
                <div class="w-2/3 flex flex-col md:flex-row gap-2">
                    <div class="form__password text-center md:w-1/2 w-full">
                        <label for="password" class="block text-sm text-gray-700 mb-1 text-left w-full">Palavra-passe</label>
                        <app-text-input id="password" type="password" placeholder="Palavra-passe" class="mb-3"></app-text-input>
                    </div>
                    <div class="form__confirm-password text-center md:w-1/2 w-full">
                        <label for="confirm-password" class="block text-sm text-gray-700 mb-1 text-left w-full">Confirmar palavra-passe</label>
                        <app-text-input id="confirm-password" type="password" placeholder="Confirmar palavra-passe" class="mb-3"></app-text-input>
                    </div>
                </div>
                <div class="w-2/3 mt-4">
                    <app-button-primary [text]="'Criar conta'" ></app-button-primary>
                </div>
            </form>
            <div class="more-options w-2/3">
                <hr class="my-4 w-full border-gray-300" />
                <app-button-primary-outlined [text]="'Entrar'" ></app-button-primary-outlined>
            </div>
        </div>
</app-introduce-layout>
