<app-introduce-layout [showIlustration]="false">
    <div class="input-section w-full py-8 flex flex-col items-center">
            <h2 class="text-2xl text-center text-blue-500 mb-4">Criar conta</h2>
            <form action="" method="post" class="flex flex-col gap-2 justify-center items-center w-full">
                <div class="form__email w-2/3 text-center">
                    <app-text-input type="email" placeholder="E-mail" class="mb-2" ></app-text-input>
                </div>
                <div class="form__username w-2/3 text-center">
                    <app-text-input type="text" placeholder="Nome de utilizador" class="mb-2"></app-text-input>
                </div>
                <div class="w-2/3 flex flex-col md:flex-row gap-1">
                    <div class="form__password text-center md:w-1/2 w-full">
                        <app-text-input type="password" placeholder="Palavra-passe"></app-text-input>
                    </div>
                    <div class="form__confirm-password text-center md:w-1/2 w-full">
                        <app-text-input type="password" placeholder="Confirmar palavra-passe"></app-text-input>
                    </div>
                </div>
                <div class="w-2/3 mt-4">
                    <app-button-primary [text]="'Criar conta'" ></app-button-primary>
                </div>
            </form>
            <div class="more-options w-2/3">
                <hr class="my-4 w-full border-gray-300" />
                <app-button-primary-outlined [text]="'Login'" ></app-button-primary-outlined>
            </div>
        </div>
</app-introduce-layout>
