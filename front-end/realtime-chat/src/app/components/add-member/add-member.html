<div class="p-4">
    <div class="flex gap-4 mb-4">
        <button class="bg-gray-300 rounded-full h-8 w-8 cursor-pointer" (click)="emmitGoBack()" ><img src="/images/left-arrow.png" alt="left-arrow icon" class="w-3 h-3 m-auto"></button>
        <h1 class="text-xl mb-4">Adicionar Membro</h1>
    </div>
    <form action="www.google.com" method="get" class="add-member-form w-full flex items-center gap-1">
        <div class="w-[50%]">
            <app-text-input [placeholder]="'Email'"></app-text-input>
        </div>
        <app-button-primary [text]="'Buscar'"></app-button-primary>
    </form>
    <section>
        <h2 class="text-md mt-4 mb-2">Resultados da Busca</h2>
        <table class="w-full rounded-md overflow-hidden shadow-md bg-white">
            <thead>
                <tr class="bg-gray-200">
                    <th class="text-left p-2">#</th>
                    <th class="text-left p-2">Nome</th>
                    <th class="text-left p-2">Email</th>
                    <th class="text-left p-2">Ação</th>
                </tr>
            </thead>
            <tbody>
                <tr class="border-b border-gray-200">
                    <td class="p-2"><img class="w-10 h-10" src="/images/user.png" alt="user avatar"></td>
                    <td class="p-2">João Silva</td>
                    <td class="p-2">joao.silva@example.com</td>
                    <td class="p-2">
                        <button (click)="openModal()" class="flex text-blue-400 gap-1 p-2 rounded-lg bg-blue-50 hover:bg-blue-100 transition cursor-pointer">
                            <span>Adicionar</span> <img src="/images/user-avatar.png" alt="avatar icon" class="h-6 w-6 m-auto cursor-pointer">
                        </button>
                    </td>
                </tr>
                <tr class="border-b border-gray-200">
                    <td class="p-2"><img class="w-10 h-10" src="/images/user.png" alt="user avatar"></td>
                    <td class="p-2">João Silva</td>
                    <td class="p-2">joao.silva@example.com</td>
                    <td class="p-2">
                        <button (click)="openModalDangerMode()" class="flex text-red-400 gap-2 p-2 rounded-lg bg-red-50 hover:bg-red-100 hover:bg-gray-300 transition cursor-pointer">
                            <span>Remover</span> <img src="/images/delete.png" alt="trash icon" class="h-5 w-5 m-auto cursor-pointer">
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

    @if(showConfirmationModal){
        <app-confirmation-modal
            [title]="modalDangerMode ? 'Remover Membro' : 'Adicionar Membro'"
            [message]=" modalDangerMode ? 'Tem certeza que deseja remover este membro do chat? Esta ação não pode ser desfeita.' : 'Por favor, confirme a adição deste novo membro ao chat.' "
            [confirmationCode]="'12345'"
            [isDanger]="modalDangerMode"
            (ConfirmActionModal)="confirm($event)"
            (close)="closeModal()"
        >
        <app-text-input
            [placeholder]="'Digite o código de confirmação aqui...'">
        </app-text-input>
        </app-confirmation-modal>
    }
</div>
